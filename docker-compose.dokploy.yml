{
  "services": {
    "gateway": {
      "build": {
        "context": ".",
        "dockerfile": "backend/deploy/Gateway.Dockerfile"
      },
      "environment": {
        "ACCOUNT_ROUTES": "${ACCOUNT_ROUTES:-false}"
      },
      "expose": [
        "80"
      ],
      "networks": [
        "private"
      ],
      "restart": "unless-stopped",
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "wget -q -O /dev/null --header='Host: castledecks.jaydensrealm.com' http://127.0.0.1/"
        ],
        "interval": "15s",
        "timeout": "3s",
        "retries": 3
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "5m",
          "max-file": "2"
        }
      }
    },
    "accounts": {
      "profiles": [
        "accounts"
      ],
      "build": {
        "context": "./backend",
        "dockerfile": "deploy/Dockerfile"
      },
      "environment": {
        "PUBLIC_ORIGIN": "https://castledecks.jaydensrealm.com",
        "ENABLE_ACCOUNTS": "${ENABLE_ACCOUNTS:-false}",
        "ENABLE_PRIVATE_ROOMS": "false",
        "DELETION_JOURNAL_PATH": "/journal/deletions.sqlite",
        "RECOVERY_POLICY_FILE": "/run/config/recovery-policy.json",
        "GOOGLE_CLIENT_ID_FILE": "/run/secrets/google-client-id",
        "GOOGLE_CLIENT_SECRET_FILE": "/run/secrets/google-client-secret",
        "TRUSTED_PROXY_CIDRS": ""
      },
      "volumes": [
        "account_data:/data",
        "deletion_data:/journal",
        {
          "type": "bind",
          "source": "../files/recovery-policy.json",
          "target": "/run/config/recovery-policy.json",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "../files/google-client-id",
          "target": "/run/secrets/google-client-id",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "../files/google-client-secret",
          "target": "/run/secrets/google-client-secret",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "networks": [
        "private"
      ],
      "read_only": true,
      "tmpfs": [
        "/tmp:size=16m,mode=1777"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "pids_limit": 64,
      "mem_limit": "256m",
      "cpus": 1,
      "stop_grace_period": "15s",
      "restart": "unless-stopped",
      "healthcheck": {
        "test": [
          "CMD",
          "/app/healthcheck"
        ],
        "interval": "30s",
        "timeout": "4s",
        "retries": 3,
        "start_period": "20s"
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "5m",
          "max-file": "2"
        }
      }
    },
    "recovery-init": {
      "profiles": [
        "recovery-init"
      ],
      "build": {
        "context": "./backend",
        "dockerfile": "deploy/Dockerfile"
      },
      "entrypoint": [
        "/app/recoveryctl"
      ],
      "command": [
        "-command",
        "init",
        "-journal",
        "/journal/deletions.sqlite",
        "-policy",
        "/run/config/recovery-policy.json"
      ],
      "volumes": [
        "deletion_data:/journal",
        {
          "type": "bind",
          "source": "../files/recovery-policy.json",
          "target": "/run/config/recovery-policy.json",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "networks": [
        "private"
      ],
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "restart": "no",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "5m",
          "max-file": "2"
        }
      }
    }
  },
  "networks": {
    "private": {}
  },
  "volumes": {
    "account_data": {},
    "deletion_data": {}
  }
}

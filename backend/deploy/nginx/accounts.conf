# Opt-in HTTP hop behind the existing approved TLS ingress.
# No real_ip trust is assumed; shared proxy limits below are a launch constraint.
limit_req_zone $binary_remote_addr zone=account_ingress:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=account_connections:1m;
server { listen 80 default_server; server_name _; return 421; }
server {
    listen 80;
    server_name castledecks.jaydensrealm.com;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    # Never log request lines containing OAuth callback query parameters.
    error_log /dev/stderr crit;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    client_max_body_size 3m;
    client_body_timeout 20s;
    send_timeout 30s;
    location = /castledecks-runtime.js {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location / { try_files $uri $uri.html $uri/ =404; }
    location ~ \.mjs$ { types { text/javascript mjs; } try_files $uri =404; }
    location = /api { return 404; }
    location = /api/ready { return 404; }
    location ^~ /api/rooms { return 404; }
    location ^~ /api/lobby { return 404; }
    location ^~ /api/ {
        limit_req zone=account_ingress burst=30 nodelay;
        limit_req_status 429;
        limit_conn account_connections 32;
        limit_conn_status 429;
        proxy_pass http://accounts:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Discard user-supplied forwarding chains. Configure verified hops later.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_send_timeout 25s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_max_temp_file_size 0;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }
}

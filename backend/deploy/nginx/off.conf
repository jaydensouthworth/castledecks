server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    # Never log request lines containing OAuth callback query parameters.
    error_log /dev/stderr crit;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    client_max_body_size 3m;
    client_body_timeout 20s;
    send_timeout 30s;
    location / { try_files $uri $uri.html $uri/ =404; }
    location ~ \.mjs$ { types { text/javascript mjs; } try_files $uri =404; }
    location = /api { return 503; }
    location ^~ /api/ { add_header Cache-Control "no-store" always; return 503; }
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Filenames are not content-hashed, so revalidate between releases.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Match the local server's extensionless HTML pages without SPA fallbacks.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Nginx's default MIME table does not include native JS modules.
    location ~ \.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
    }
}
